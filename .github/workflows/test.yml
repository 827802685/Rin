name: CI - Test and Type Check

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-server:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run server tests
        run: bun run test
        working-directory: ./server
      
      - name: Type check server
        run: bun run check
        working-directory: ./server

  test-client:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run client tests
        run: bun run test
        working-directory: ./client
      
      - name: Type check client
        run: bun run check
        working-directory: ./client
      
      - name: Build client
        run: bun run build
        working-directory: ./client

  typecheck:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run type check
        run: bun run check

